name: Build CH5

on:
  push:
    branches:
      - '**'
# Asked for here rather than taken from the organization's default token permissions, which can be read-only: the
# version step and the release write with the workflow's own token, and the build job asks for an id token. A called
# job gets no more than this caller allows.
permissions:
  contents: write
  id-token: write

jobs:
  get_version:
    uses: ./.github/workflows/get-version.yaml
    secrets: inherit
  build_and_push:
    uses: ./.github/workflows/build-and-push.yaml
    secrets: inherit
    needs: get_version
    with:
      newVersion: ${{ needs.get_version.outputs.newVersion }}
      version: ${{ needs.get_version.outputs.version }}
      hash: ${{ needs.get_version.outputs.hash }}
      tag: ${{ needs.get_version.outputs.tag }}
      channel: ${{ needs.get_version.outputs.channel }}
